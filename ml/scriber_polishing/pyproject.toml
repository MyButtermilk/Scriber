[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scriber-polishing"
version = "0.1.0"
description = "AI-only data, training, evaluation, and safe local inference for Scriber transcript polishing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.11,<2",
  "bitsandbytes>=0.49,<0.50",
  "datasets>=4.4,<5",
  "evaluate>=0.4.6,<0.5",
  "huggingface-hub>=0.36,<1",
  "jiwer>=4,<5",
  "nvidia-ml-py>=13,<14",
  "peft>=0.18,<1",
  "psutil>=7.1,<8",
  "sacrebleu>=2.5,<3",
  "safetensors>=0.6,<1",
  "sentencepiece>=0.2,<0.3",
  "tensorboard>=2.20,<3",
  "torch==2.11.0",
  "transformers>=4.57,<5",
  "trl==0.29.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scriber_polishing"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
