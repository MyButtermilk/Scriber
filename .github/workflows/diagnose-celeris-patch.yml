name: Diagnose Celeris patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-celeris-patch.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Run patch with captured diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base64 --decode scripts/.implement_celeris_v0_5_43.py.gz.b64 | gzip --decompress > /tmp/implement_celeris_v0_5_43.py
          set +e
          output="$(python /tmp/implement_celeris_v0_5_43.py 2>&1)"
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            printf '%s\n' "$output"
            gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Patch diagnostic failed:\n\n\`\`\`\n${output:0:12000}\n\`\`\`\n\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            exit "$status"
          fi
          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Patch application succeeded in diagnostic workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
