name: Implement Celeris v0.5.43

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/implement-celeris-v0.5.43.yml
      - scripts/.implement_celeris_v0_5_43.py.gz.b64

concurrency:
  group: implement-celeris-v0.5.43
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  CELERIS_API_KEY: ${{ secrets.CELERIS_API_KEY }}

jobs:
  implement-test-release:
    if: startsWith(github.event.head_commit.message, 'Run Celeris integration v0.5.43')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.14'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.3.1'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Implement, validate, commit, tag, and verify signed release
        shell: bash
        run: |
          set -Eeuo pipefail
          issue_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/25"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failure_comment() {
            local exit_code=$?
            local failed_line="${1:-unknown}"
            local failed_command="${2:-unknown}"
            failed_command="${failed_command:0:400}"
            gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Celeris integration workflow failed at shell line ${failed_line} while running: \`${failed_command}\`. Workflow: ${run_url}" >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap 'failure_comment "$LINENO" "$BASH_COMMAND"' ERR

          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Implementation and validation started in GitHub Actions. Workflow: ${run_url}" >/dev/null

          base64 --decode scripts/.implement_celeris_v0_5_43.py.gz.b64 | gzip --decompress > /tmp/implement_celeris_v0_5_43.py
          python /tmp/implement_celeris_v0_5_43.py

          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio aiohttp loguru python-dotenv
          python -m pytest -q \
            tests/test_celeris_integration.py \
            tests/test_summarization.py \
            tests/test_meeting_analysis.py \
            tests/test_config.py

          npm ci --prefix Frontend
          npm run check --prefix Frontend
          npm run build:webview --prefix Frontend
          python scripts/sync_version.py

          live_status="skipped because the CELERIS_API_KEY repository secret is not configured"
          if [[ -n "${CELERIS_API_KEY:-}" ]]; then
            python scripts/smoke_celeris.py
            live_status="passed with the CELERIS_API_KEY repository secret"
          fi

          if grep -R -nE 'ck_[A-Za-z0-9_-]{20,}' --exclude-dir=.git .; then
            echo "A value matching a Celeris API-key pattern was found in the repository." >&2
            exit 1
          fi
          git diff --check

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main moved while the integration workflow was running; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.43 >/dev/null 2>&1; then
            echo "Tag v0.5.43 already exists." >&2
            exit 1
          fi

          git rm .github/workflows/implement-celeris-v0.5.43.yml scripts/.implement_celeris_v0_5_43.py.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Celeris summaries for Meeting, YouTube, and File (#25)"
          implementation_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git tag -a v0.5.43 -m "Scriber v0.5.43"
          git push origin v0.5.43

          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Implementation committed to main at ${implementation_sha}. Focused backend tests, TypeScript checks, and the production WebView build passed. Live API smoke test: ${live_status}. Tag v0.5.43 was pushed; waiting for the signed Windows release workflow." >/dev/null

          release_run_id=""
          release_run_url=""
          release_conclusion=""
          for _ in $(seq 1 150); do
            release_line="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-windows.yml \
              --branch v0.5.43 \
              --limit 20 \
              --json databaseId,status,conclusion,url,headSha \
              --jq '.[] | select(.headSha == "'"$implementation_sha"'") | [.databaseId,.status,(.conclusion // ""),.url] | @tsv' \
              | head -n 1 || true)"
            if [[ -n "$release_line" ]]; then
              IFS=$'\t' read -r release_run_id release_status release_conclusion release_run_url <<< "$release_line"
              if [[ "$release_status" == "completed" ]]; then
                break
              fi
            fi
            sleep 20
          done

          if [[ -z "$release_run_id" ]]; then
            gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Implementation and tag v0.5.43 succeeded, but the signed Windows release run could not be located. Implementation commit: ${implementation_sha}." >/dev/null
            exit 1
          fi
          if [[ "$release_conclusion" != "success" ]]; then
            gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Implementation and tag v0.5.43 succeeded, but the signed Windows release did not complete successfully. Release workflow: ${release_run_url}" >/dev/null
            exit 1
          fi

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v0.5.43"
          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "Completed. Celeris is available for Meeting analysis and File/YouTube summaries on main. Version v0.5.43 was built by the signed Windows release workflow. Commit: ${implementation_sha}. Release: ${release_url}. Workflow: ${release_run_url}. Live API smoke test: ${live_status}." >/dev/null
          gh issue close 25 --repo "$GITHUB_REPOSITORY" --reason completed >/dev/null
          trap - ERR
