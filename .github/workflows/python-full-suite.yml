name: Python Full Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-full-suite:
    name: Python full suite
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
            requirements-test.txt
            requirements-test-constraints.txt
            requirements-release-constraints.txt

      - name: Create isolated test environment
        shell: pwsh
        run: python -m venv venv

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          .\venv\Scripts\python.exe -m pip install pip==26.1.2
          .\venv\Scripts\python.exe -m pip install `
            -c requirements-test-constraints.txt `
            -c requirements-release-constraints.txt `
            -r requirements-base.txt `
            -r requirements-test.txt
          .\venv\Scripts\python.exe -m pip check

      - name: Set up pinned Node for the real-browser File smoke
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies for the real-browser File smoke
        working-directory: Frontend
        run: npm ci --no-audit --no-fund

      - name: Restore locked FFmpeg test runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & .\scripts\ffmpeg\restore_profile_b_release_artifact.ps1 `
            -Repo MyButtermilk/Scriber `
            -Tag ffmpeg-profile-b-n7.0-v4 `
            -AssetName scriber-ffmpeg-profile-b-n7.0-v4-Windows.zip
          $mediaTools = (Resolve-Path `
            "build\ffmpeg-profile-b-msys2\dist\scriber-ffmpeg-profile-b\bin").Path
          & .\venv\Scripts\python.exe scripts\ffmpeg\validate_ffmpeg_profile.py `
            --media-tools-dir $mediaTools `
            --profile B `
            --require-lgpl `
            --output build\ffmpeg-profile-b-msys2\ffmpeg-profile-b-manifest.json
          if ($LASTEXITCODE -ne 0) {
            throw "Locked FFmpeg test runtime validation failed."
          }
          "SCRIBER_MEDIA_TOOLS_DIR=$mediaTools" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run complete Python test suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\test-results | Out-Null
          .\venv\Scripts\python.exe -m pytest -n 4 --dist loadfile -ra `
            --junitxml build\test-results\python-full-suite.xml

      - name: Run real-browser File upload against production composition
        shell: pwsh
        run: >-
          .\venv\Scripts\python.exe scripts\smoke_real_file_upload_browser.py
          --output build\test-results\real-file-browser-smoke.json

      - name: Typecheck extended Python tranche
        shell: pwsh
        run: >-
          .\venv\Scripts\python.exe -m mypy
          src\api
          src\core
          src\runtime
          src\data
          src\native_overlay.py
          src\soniox_region.py
          src\version.py
          src\config.py
          src\main.py
          src\backend_worker.py
          src\export.py
          src\post_processing.py
          src\meeting_export.py

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-full-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/python-full-suite.xml
            build/test-results/real-file-browser-smoke.json
          if-no-files-found: warn
          retention-days: 14
