name: Python Full Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-full-suite:
    name: Python full suite
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
            requirements-test.txt
            requirements-test-constraints.txt

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.1.2
          python -m pip install `
            -c requirements-test-constraints.txt `
            -r requirements-base.txt `
            -r requirements-test.txt
          python -m pip check

      - name: Run complete Python test suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\test-results | Out-Null
          python -m pytest -n 4 --dist loadfile -ra `
            --junitxml build\test-results\python-full-suite.xml

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-full-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/python-full-suite.xml
          if-no-files-found: warn
          retention-days: 14
