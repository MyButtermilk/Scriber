name: Pre-tag Release Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualification-plan:
    name: Authorize exact main qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      reuse-quality: ${{ steps.quality-source.outputs.reuse-quality }}
      quality-source-run-id: ${{ steps.quality-source.outputs.quality-source-run-id }}
      quality-source-run-attempt: ${{ steps.quality-source.outputs.quality-source-run-attempt }}
    steps:
      - name: Require canonical main dispatch
        env:
          QUALIFICATION_ALLOWED: ${{ github.repository == 'MyButtermilk/Scriber' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: test "$QUALIFICATION_ALLOWED" = true
      - name: Checkout exact qualified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.9"
      - name: Select canonical main quality evidence
        id: quality-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.ci.pre_tag_qualification plan
          --repo "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --head-sha "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"
          --evidence build/test-results/pre-tag-quality-source.json

  quality-gates:
    name: Reusable quality gates
    needs: qualification-plan
    if: needs.qualification-plan.outputs.reuse-quality == 'false'
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read

  reuse-main-quality:
    # The successful API job name binds the exact source independently of artifacts.
    name: Reuse canonical main quality (${{ needs.qualification-plan.outputs.quality-source-run-id }}/${{ needs.qualification-plan.outputs.quality-source-run-attempt }})
    needs: qualification-plan
    if: needs.qualification-plan.outputs.reuse-quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact qualified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.9"
      - name: Verify selected main quality evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.ci.pre_tag_qualification reuse
          --repo "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --head-sha "${{ github.sha }}"
          --source-run-id "${{ needs.qualification-plan.outputs.quality-source-run-id }}"
          --source-run-attempt "${{ needs.qualification-plan.outputs.quality-source-run-attempt }}"
          --evidence build/test-results/pre-tag-reused-quality.json

  qualification-contract:
    name: Verify pre-tag quality contract
    needs: [qualification-plan, quality-gates, reuse-main-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful selected quality branch
        env:
          PLAN_RESULT: ${{ needs.qualification-plan.result }}
          REUSE_QUALITY: ${{ needs.qualification-plan.outputs.reuse-quality }}
          LOCAL_RESULT: ${{ needs.quality-gates.result }}
          REUSE_RESULT: ${{ needs.reuse-main-quality.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$REUSE_QUALITY" in
            true) test "$REUSE_RESULT" = success && test "$LOCAL_RESULT" = skipped ;;
            false) test "$LOCAL_RESULT" = success && test "$REUSE_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact qualified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.9"
      - name: Verify current-run quality evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.ci.pre_tag_qualification qualify
          --repo "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --head-sha "${{ github.sha }}"
          --evidence build/test-results/pre-tag-qualification.json
      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pre-tag-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/pre-tag-qualification.json
          if-no-files-found: error
          retention-days: 2
