name: Reusable Quality Gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-ruff:
    name: Repository-wide Python Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install locked Ruff
        run: python -m pip install ruff==0.15.22
      - name: Lint all maintained Python
        run: python -m ruff check src tests scripts
      - name: Check all maintained Python formatting
        run: python -m ruff format --check src tests scripts

  python-full-suite:
    name: Python tests and extended mypy
    uses: ./.github/workflows/python-full-suite.yml
    permissions:
      contents: read

  frontend:
    name: Frontend check, lint, test, and build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: Frontend
        run: npm run check
      - name: Lint frontend
        working-directory: Frontend
        run: npm run lint
      - name: Test frontend
        working-directory: Frontend
        run: npm test
      - name: Build frontend
        working-directory: Frontend
        run: npm run build

  rust:
    name: Rust fmt, clippy, and tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend assets for Tauri gates
        working-directory: Frontend
        run: npm run build
      - name: Create placeholder backend resource directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force Frontend\src-tauri\target\release\backend | Out-Null
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          components: rustfmt, clippy
      - name: Identify Rust quality compilation environment
        id: rust-quality-environment
        shell: pwsh
        run: |
          $compiler = (& rustc --version --verbose) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Could not identify the Rust compiler." }
          $node = (& node --version) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Could not identify Node." }
          foreach ($value in @($env:ImageOS, $env:ImageVersion, $compiler, $node)) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "The Rust quality cache requires the exact hosted image and toolchain identity."
            }
          }
          $identity = @(
            $env:RUNNER_OS, $env:RUNNER_ARCH, $env:ImageOS, $env:ImageVersion,
            $compiler, $node, $env:CARGO_INCREMENTAL, $env:RUSTFLAGS,
            $env:CARGO_ENCODED_RUSTFLAGS, $env:RUSTDOCFLAGS
          ) -join "`n"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($identity)
          $hash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "identity=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore Rust quality compilation cache
        id: rust-quality-cache
        uses: actions/cache/restore@v6
        with:
          # This is compilation state, never test evidence or a release product.
          # Cargo checks the fresh checkout and frontend assets on every run.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            Frontend/src-tauri/target/debug/.fingerprint
            Frontend/src-tauri/target/debug/build
            Frontend/src-tauri/target/debug/deps
            Frontend/src-tauri/target/debug/incremental
          key: scriber-rust-quality-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-quality-environment.outputs.identity }}-${{ hashFiles('.node-version', 'Frontend/src-tauri/Cargo.toml', 'Frontend/src-tauri/Cargo.lock', 'Frontend/src-tauri/build.rs', 'Frontend/src-tauri/tauri.conf.json', 'Frontend/src-tauri/capabilities/**', '.cargo/config', '.cargo/config.toml', 'Frontend/src-tauri/.cargo/config', 'Frontend/src-tauri/.cargo/config.toml', '.github/workflows/quality-gates.yml') }}
      - name: Check Rust formatting
        working-directory: Frontend/src-tauri
        run: cargo fmt --all -- --check
      - name: Run Rust clippy
        working-directory: Frontend/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: Frontend/src-tauri
        run: cargo test --locked --all-targets
      - name: Save trusted Rust quality compilation cache
        if: >-
          success() &&
          github.repository == 'MyButtermilk/Scriber' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.rust-quality-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            Frontend/src-tauri/target/debug/.fingerprint
            Frontend/src-tauri/target/debug/build
            Frontend/src-tauri/target/debug/deps
            Frontend/src-tauri/target/debug/incremental
          key: ${{ steps.rust-quality-cache.outputs.cache-primary-key }}
