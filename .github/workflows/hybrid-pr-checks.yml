name: Hybrid PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hybrid-pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Reusable quality gates
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read

  release-quality-contract:
    name: Verify release quality barrier
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Verify current-run quality evidence through GitHub API
        # GitHub's jobs API identifies PR runs by the head commit; checkout and
        # the actual tests still use github.sha (the synthetic merge commit).
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/wait_release_quality_gates.py
          --repo "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --job-prefix "Reusable quality gates"
          --timeout-seconds 120
          --evidence build/test-results/release-quality-gates.json
      - name: Upload quality barrier evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-quality-barrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/release-quality-gates.json
          if-no-files-found: error

  python-gates:
    name: Python hybrid gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Python gate dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.1.2
          python -m pip install `
            -c requirements-test-constraints.txt `
            -r requirements-dev.txt `
            aiohttp
          python -m pip check

      - name: Run focused Python gates
        shell: pwsh
        run: |
          python -m pytest `
            tests\test_tauri_security_gates.py `
            tests\perf\test_frontend_browser_smoke_script.py `
            tests\test_validate_hybrid_release_readiness.py `
            tests\test_hybrid_release_readiness_runner.py `
            tests\test_verify_tauri_updater_publication.py `
            tests\test_windows_authenticode_gate.py `
            tests\test_tauri_stability_smoke_gates.py `
            tests\test_build_quickjs_youtube_runtime.py `
            tests\perf\test_media_preparation_smoke_script.py

      - name: Verify QuickJS wrapper cache asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/verify_quickjs_wrapper_cache_asset.ps1 -Repo "${{ github.repository }}"

  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"

      - name: Lint GitHub Actions workflows
        # actionlint v1.7.12 predates GitHub's documented concurrency.queue
        # property. Ignore only that known schema lag while retaining every
        # other syntax, expression, runner, and shell check.
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          -ignore 'unexpected key "queue" for "concurrency" section'
