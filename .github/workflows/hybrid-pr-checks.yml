name: Hybrid PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hybrid-pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Reusable quality gates
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read

  python-gates:
    name: Python hybrid gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"

      - name: Install Python gate dependencies
        shell: pwsh
        run: |
          python -m pip install pip==26.1.2
          python -m pip install `
            -c requirements-test-constraints.txt `
            -r requirements-dev.txt `
            aiohttp
          python -m pip check

      - name: Run focused Python gates
        shell: pwsh
        run: |
          python -m pytest `
            tests\test_tauri_security_gates.py `
            tests\perf\test_frontend_browser_smoke_script.py `
            tests\test_validate_hybrid_release_readiness.py `
            tests\test_hybrid_release_readiness_runner.py `
            tests\test_verify_tauri_updater_publication.py `
            tests\test_windows_authenticode_gate.py `
            tests\test_tauri_stability_smoke_gates.py `
            tests\test_build_quickjs_youtube_runtime.py `
            tests\perf\test_media_preparation_smoke_script.py

      - name: Verify QuickJS wrapper cache asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/verify_quickjs_wrapper_cache_asset.ps1 -Repo "${{ github.repository }}"

  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"

      - name: Lint GitHub Actions workflows
        # actionlint v1.7.12 predates GitHub's documented concurrency.queue
        # property. Ignore only that known schema lag while retaining every
        # other syntax, expression, runner, and shell check.
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          -ignore 'unexpected key "queue" for "concurrency" section'
