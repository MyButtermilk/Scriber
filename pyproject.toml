[tool.ruff]
target-version = "py314"
line-length = 120
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
platform = "win32"
follow_imports = "silent"
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/api", "src/core", "src/runtime", "src/data"]

[[tool.mypy.overrides]]
# onnxruntime does not publish a py.typed marker; SmartTurn still validates its
# runtime surface and attested model before installing the acceleration proxy.
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
