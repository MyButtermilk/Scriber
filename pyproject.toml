[tool.ruff]
target-version = "py313"
line-length = 120
unsafe-fixes = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
platform = "win32"
follow_imports = "silent"
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/core", "src/runtime", "src/data"]
