[package]
name = "scriber-audio-sidecar"
version = "0.1.0"
description = "Scriber audio capture worker"
authors = ["Scriber"]
edition = "2021"
license = "MIT"
publish = false

# Worker identity is independent of the desktop app version. Production and
# desktop development builds compile the same audited source and modules.
[[bin]]
name = "scriber-audio-sidecar"
path = "../../Frontend/src-tauri/src/audio_sidecar.rs"

[features]
default = []
codec-experimental-flacenc-stable = []
codec-experimental-flacenc-nightly = []
codec-experimental-rezin-flac = []
codec-experimental-ruopus = []
codec-experimental-libopusenc = []
codec-experimental-mp3lame = []
codec-experimental-shine = []

[build-dependencies]
tauri-winres = "=0.3.6"

[dependencies]
aec3 = "=0.2.0"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Performance",
  "Win32_System_Pipes",
] }
