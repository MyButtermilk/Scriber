[workspace]
members = [".", "crates/scriber-shell-core"]
default-members = [".", "crates/scriber-shell-core"]

[package]
name = "scriber-desktop"
version = "0.1.0"
description = "Scriber desktop shell"
authors = ["Scriber"]
edition = "2021"
default-run = "scriber-desktop"

[features]
default = []
# Codec lab gates. These names intentionally carry no dependency yet: a
# candidate is not part of the installer until measured, pinned, and promoted.
codec-experimental-flacenc-stable = []
codec-experimental-flacenc-nightly = []
codec-experimental-rezin-flac = []
codec-experimental-ruopus = []
codec-experimental-libopusenc = []
codec-experimental-mp3lame = []
codec-experimental-shine = []

[lib]
name = "scriber_desktop_lib"
path = "src/desktop_entry.rs"
crate-type = ["rlib"]

[[bin]]
name = "scriber-desktop"
path = "src/main.rs"

[[bin]]
name = "minisign-verify"
path = "src/minisign_verify.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
scriber-shell-core = { path = "crates/scriber-shell-core" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
# Keep direct Tauri plugin dependencies on the root package so `tauri-build`
# registers their capability schemas for `capabilities/default.json` while
# sharing the single workspace compilation of each plugin crate.
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
minisign-verify = "=0.2.5"
base64 = "=0.22.1"

[profile.release.package.scriber-desktop]
# Optimize the desktop UI/IPC shell at level 2 while preserving Cargo's default
# release settings (dependencies at -O3, build scripts / proc-macros at -O0);
# audio DSP and diarization live in standalone crates with their own Cargo.toml
# and keep full -O3.
opt-level = 2

[profile.release.package.scriber-shell-core]
opt-level = 2
